server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://${BACKEND_HOST};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Faro config that Nais mounts into the pod (frontend/.nais/app.yaml). Without the
    # file (locally) this must 404, not fall back to index.html, so Faro stays off.
    location = /js/nais.js {
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
