worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log: one JSON object per request, with field names in the
    # style of the Kotlin apps' logstash format. Loki parses it with `| json`.
    map $status $log_level {
        ~^5     ERROR;
        ~^4     WARN;
        default INFO;
    }
    # The trace id from a W3C traceparent header (00-<trace id>-<span id>-<flags>),
    # sent by browsers with OpenTelemetry/Faro tracing. Empty otherwise.
    map $http_traceparent $trace_id {
        "~^00-(?<tid>[0-9a-f]{32})-" $tid;
        default "";
    }
    # The path the client asked for. $uri changes when index/try_files rewrite the
    # request, so every SPA route would otherwise be logged as /index.html.
    map $request_uri $request_path {
        "~^(?<p>[^?]*)" $p;
        default $request_uri;
    }
    # Times are in seconds with millisecond resolution. upstream_time_s is a string:
    # empty without an upstream, and a list ("0.000, 0.001") when nginx tries several.
    # No client IPs or user agents: they identify people and are not needed here.
    log_format json escape=json
        '{'
            '"@timestamp":"$time_iso8601",'
            '"level":"$log_level",'
            '"logger_name":"nginx.access",'
            '"message":"$request_method $request_path $status",'
            '"method":"$request_method",'
            '"path":"$request_path",'
            '"query":"$args",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"request_time_s":$request_time,'
            '"upstream_time_s":"$upstream_response_time",'
            '"trace_id":"$trace_id"'
        '}';
    access_log /dev/stdout json;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /tmp/default.conf;
}
