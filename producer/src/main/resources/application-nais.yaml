spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS}
    security:
      protocol: SSL
    ssl:
      key-store-location: file:${KAFKA_KEYSTORE_PATH}
      key-store-type: PKCS12
      key-store-password: ${KAFKA_CREDSTORE_PASSWORD}
      key-password: ${KAFKA_CREDSTORE_PASSWORD}
      trust-store-location: file:${KAFKA_TRUSTSTORE_PATH}
      trust-store-type: JKS
      trust-store-password: ${KAFKA_CREDSTORE_PASSWORD}
logging:
  structured:
    # One JSON object per line for Loki: multi-line messages stay one record, and the
    # agent's trace_id/span_id (MDC) and addKeyValue() fields become JSON fields.
    format:
      console: logstash
