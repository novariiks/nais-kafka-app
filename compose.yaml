x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Containers use kafka:19092; ./gradlew bootRun on the host uses localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Same topic name and partition count as .nais/topic.yaml.
  kafka-init:
    image: apache/kafka:4.4.0
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
      --topic flais.nais-kafka-events --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy

  # Grafana with Tempo on http://localhost:3001 (Explore → Tempo).
  lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
      target: local
    environment:
      <<: *otel
      KAFKA_BROKERS: kafka:19092
      OTEL_SERVICE_NAME: nais-kafka-consumer
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      lgtm:
        condition: service_started

  # Publishes one run and exits, like the Naisjob. Run again with:
  #   docker compose run --rm producer
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
      target: local
    environment:
      <<: *otel
      KAFKA_BROKERS: kafka:19092
      OTEL_SERVICE_NAME: nais-kafka-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      consumer:
        condition: service_started
