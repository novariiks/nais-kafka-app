name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  NAIS_ENVIRONMENT: test

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and push image
        uses: nais/docker-build-push@v1.0.0
        id: image
        with:
          team: flais
          tenant: novari
          dockerfile: frontend/Dockerfile
          docker_context: .
          image_suffix: frontend
          cache_from: type=gha,scope=frontend
          cache_to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nais/setup@v1.0.3
        with:
          team: flais
      - name: Deploy frontend
        run: >-
          nais apply frontend/.nais/app.yaml
          --environment "$NAIS_ENVIRONMENT"
          --set spec.image="$IMAGE"
          --wait
