name: Deploy consumer

on:
  push:
    branches: [main]
    paths:
      - 'consumer/**'
      - 'events/**'
      - '.nais/topic.yaml'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.dockerignore'
      - '.github/workflows/deploy-consumer.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-consumer
  cancel-in-progress: false

env:
  NAIS_ENVIRONMENT: test

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and push image
        uses: nais/docker-build-push@v1.0.0
        id: image
        with:
          team: flais
          tenant: novari
          dockerfile: consumer/Dockerfile
          docker_context: .
          image_suffix: consumer
          cache_from: type=gha,scope=consumer
          cache_to: type=gha,mode=max,scope=consumer

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: nais/setup@v1.0.3
        with:
          team: flais
      # Both Kafka workloads apply the topic, so either can be deployed first.
      - name: Apply Kafka topic
        run: nais apply .nais/topic.yaml --environment "$NAIS_ENVIRONMENT" --wait
      - name: Deploy consumer
        run: >-
          nais apply consumer/.nais/app.yaml
          --environment "$NAIS_ENVIRONMENT"
          --set spec.image="$IMAGE"
          --wait
